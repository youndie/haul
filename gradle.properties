org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Not published: the group exists because the conventions ask for one. Nothing here goes to a
# repository of artefacts; the server ships as an image, the storefront as a bundle the server serves.
sborka.group=io.github.youndie
sborka.repository=youndie/haul
sborka.description=An open, end-to-end marketplace storefront in Kotlin.
sborka.inceptionYear=2026
sborka.licence=The MIT License

# The floor is the toolchain's 25: this repository's only consumer is its own container, and zavarnik
# needs JDK 25 to train the AOT cache (research §1.5).
sborka.jvmFloor=25

# The Kotlin plugin declares the repository for the Node distribution `wasmJs` needs on the project
# itself; `PREFER_PROJECT` is the mode that leaves it able to fetch its own toolchain (as in shashki).
sborka.repositoriesMode=PREFER_PROJECT

# `:composeApp` runs kompot's registry processor over common metadata AND viddik's screenshot
# processor over `desktopTest`, and wires both in its build script; `sborka.kmp` serves only the
# common-metadata case and refuses a module with processors in both places (as in shashki).
sborka.kspHandWired=:composeApp
