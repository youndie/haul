name: publish image

# The images the public demo stand runs (research D6, B-27): `ghcr.io/youndie/haul-server:<tag>`, and
# beside it the synthetic shoppers (B-31) `ghcr.io/youndie/haul-shoppers:<tag>`, which the chart runs under
# the server's tag when `shoppers.enabled` — published from a pushed tag `v*`, and by hand against a tag
# ref, for a run that failed.
#
# NOTHING HERE DEPLOYS. The stand is deployed from the infrastructure repository, which holds its
# values, its secrets and the tag it runs, and deploys when that tag changes there (B-27, Iteration 2).
# Publishing an image is this repository's half; choosing to run it is the other's.
#
# A TAG, ALWAYS. The version is read from the ref, so the image cannot be named after something that
# is not a release: an image called after a branch is one nobody can map back to a commit.
#
# No secret beyond the job's own GITHUB_TOKEN: it may write this owner's packages, and the image
# carries `org.opencontainers.image.source`, so the package takes the repository's (public)
# visibility and the cluster pulls it without credentials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A ref that is not a tag is not a release: refused rather than named after a branch.
      - name: The version comes from the tag, or there is no version
        run: |
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "::error::this ran on ${{ github.ref }} — publish from a tag, which is what names the image"
            exit 1
          fi
          echo "IMAGE=ghcr.io/youndie/haul-server:${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "SHOPPERS=ghcr.io/youndie/haul-shoppers:${{ github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Refused rather than overwritten. A tag republished changes no rendered spec, so nothing
      # downstream restarts and the cluster keeps the previous binary behind a green deploy.
      - name: Refuse a tag that is already published
        run: |
          for image in "$IMAGE" "$SHOPPERS"; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::error::$image exists already — cut a new tag"
              exit 1
            fi
          done

      # The same script every pull request runs: the image is built, its AOT cache must be accepted
      # with all of the server's classes in it, and it must serve the page — before anything is pushed.
      - name: Build and verify the image
        run: scripts/image-check.sh "$IMAGE"

      # The shoppers' image: built from the same commit, started, and made to refuse an empty configuration.
      - name: Build and verify the shoppers' image
        run: scripts/shoppers-check.sh "$SHOPPERS"

      - name: Push
        run: |
          docker push "$IMAGE"
          docker push "$SHOPPERS"

  # The registry round trip: the image just published is pulled back and the whole path — browse,
  # buy, receive, return, against PostgreSQL and shildik (B-26) — is walked through IT, not through a
  # local build. Running what the previous job left in its daemon proves the build; pulling it proves
  # that what was published is what runs.
  verify:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/youndie/haul-server:${{ github.ref_name }}
      SHOPPERS: ghcr.io/youndie/haul-shoppers:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Pulled anonymously, as the cluster will: a package that landed private fails here, with the
      # registry's own message, rather than as a pod in ImagePullBackOff after the deploy.
      - name: Pull what was just published, without credentials
        run: |
          docker pull "$IMAGE"
          docker pull "$SHOPPERS"

      # The shoppers' package is a second one, and takes the repository's visibility the same way; pulled
      # above, here it is started as published and must refuse an empty configuration (exit 2).
      - name: The shoppers' image starts as published
        run: |
          status=0; out=$(docker run --rm "$SHOPPERS" 2>&1) || status=$?
          echo "$out"
          [ "$status" = 2 ] && case "$out" in *"HAUL_SHOPPERS_ORIGIN is required"*) true ;; *) false ;; esac

      - name: Walk the whole path through it
        env:
          E2E_SKIP_BUILD: "true"
        run: scripts/e2e.sh "$IMAGE"
