# The public demo stand (research D6). Applied over values.yaml:
#
#   helm upgrade --install haul charts/haul -n haul -f charts/haul/values-stand.yaml \
#     --set server.version=<commit> --set postgres.password=... --set observability.tracy.key=...
#
# The keys and the password are not here and never will be; see values.yaml.

# ASSUMPTION, the owner's to confirm: the sibling stands live at <name>.kotlin.website.
hostname: haul.kotlin.website

server:
  # The stand is a demo, and its catalog is the generated one.
  seed: true

postgres:
  # The class the cluster's other single-pod databases claim.
  storageClass: local-path

observability:
  environment: stand
  # Empty on purpose until the cluster is chosen: metrik's ingest is UDP on a Service inside the
  # cluster metrik runs in, not on its public host. Same cluster → its ingest Service's `host:9999`.
  metrik:
    endpoint: ""
  # ASSUMPTION: the sibling stands' public tracy and katcher, which accept writes on their hosts.
  tracy:
    endpoint: https://tracy.kotlin.website
    sampleRate: "1.0"
  katcher:
    endpoint: https://katcher.kotlin.website

traefik:
  certResolver: cloudflare
