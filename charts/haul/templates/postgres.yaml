{{/*
The database: one pod, one volume, Recreate — the shape the sibling reference services run.

A Deployment rather than a StatefulSet: one replica of either is one pod with one claim, and a
Deployment says what this is without the ordinal naming. Recreate because the volume is
ReadWriteOnce: a rolling update would wait for a volume the outgoing pod has not released.

The claim is kept on `helm uninstall` (`helm.sh/resource-policy: keep`): the stand's data outlives a
release, and removing it is a decision taken with `kubectl delete pvc`, not a side effect.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "haul.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "haul.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: postgres
      {{- /*
      The password only, not the whole Secret: an agent's key changing must not restart the database
      (measured: with the Secret's checksum here, adding the tracy key recreated this pod).
      */}}
      annotations:
        checksum/password: {{ .Values.postgres.password | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
            # 18 keeps its cluster in a subdirectory of the mount, so the data directory is named: a
            # fresh volume's lost+found beside nothing would otherwise be refused.
            - name: PGDATA
              value: /var/lib/postgresql/data
          ports:
            - name: postgres
              containerPort: 5432
          # `pg_isready` asks the server; a TCP probe would pass against a database still replaying its
          # WAL, and the server's first migration would fail against it.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "haul.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
