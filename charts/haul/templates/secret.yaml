{{/*
Everything that must not be in a values file, in one object; the server's pod carries a checksum of
it, so a changed key restarts the server. The agent keys appear only when their endpoint does.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "haul.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ include "haul.require" (dict "name" "postgres.password" "because" "a password written into the chart is one every reader of the repository can use from inside the cluster" "value" .Values.postgres.password) | quote }}
  {{- range $name := list "metrik" "tracy" "katcher" }}
  {{- $agent := index $.Values.observability $name }}
  {{- if $agent.key }}
  {{ $name }}-key: {{ $agent.key | quote }}
  {{- end }}
  {{- end }}
