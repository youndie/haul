# Versions this repository chooses. Kotlin, Compose Multiplatform, Ktor, Koin and kotlinx come from
# the conventions' `wip` catalog (settings.gradle.kts), so the compiler moves when the conventions do.
#
# A library is added by the item that first needs it, not up front: an entry nothing uses is a version
# Renovate keeps bumping for nobody.

[versions]
sborka = "0.5.0.113"
# A snapshot of kompot's main, as the sibling reference service pins it (research §1.1); kompot-core is
# what the contract's components are built on.
kompot = "0.40.0.210"
logback = "1.5.20"
# PostgreSQL through Exposed over JDBC, the pair petich-postgres runs on (research D3); the versions are
# the sibling reference service's (research §1.1).
exposed = "1.4.0"
hikari = "7.1.0"
postgresql = "42.7.13"
flyway = "13.3.0"
testcontainers = "1.21.4"
# The AOT cache for start-up (research §1.5).
zavarnik = "0.1.0"
# Screenshot goldens and design parity; parity arrived in 0.5.0.
viddik = "0.7.0"
# Who watches the stand (B-27): metrik counts every route, tracy carries the trace and the logs,
# katcher files what the server failed with. The newest published of each, except tracy: from 0.3 its
# Ktor server plugin moved into `agent-ktor-server`, which is not published yet, so 0.2.15 — what the
# sibling reference services run — is the newest tracy a Ktor server can install.
metrikAgent = "0.3.26"
tracyAgent = "0.2.15"
katcher = "0.8.51"
# Product photos in the storefront (B-30): Coil 3 publishes wasmJs, loads over Ktor and caches in memory;
# built against Kotlin 2.4.10, so the 2.4.20 compiler reads its klibs. Released 2026-09-18.
coil = "3.6.3"
# Sign-in (B-12): the server checks shildik's tokens with shildik's own validator (research §1.4,
# consequence 5). The newest build of its 0.4.1 line; the image the tests sign in against is 0.4.1.
shildik = "0.4.1.23"
# The browser's half of the sign-in: kalinjul's kotlin-multiplatform-oidc, the client shildik's app
# contour was accepted against (shildik docs/api/protocol-oidc-app.md, 0.18.4). A new version is a new
# acceptance run there, not a dependency refresh here.
oidc = "0.18.4"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host" }
kompot-core = { module = "io.github.youndie.kompot:kompot-core", version.ref = "kompot" }
kompot-standard = { module = "io.github.youndie.kompot:kompot-standard", version.ref = "kompot" }
kompot-ktor = { module = "io.github.youndie.kompot:kompot-ktor", version.ref = "kompot" }
kompot-client = { module = "io.github.youndie.kompot:kompot-client", version.ref = "kompot" }
kompot-registryAnnotations = { module = "io.github.youndie.kompot:kompot-registry-annotations", version.ref = "kompot" }
kompot-registryProcessor = { module = "io.github.youndie.kompot:kompot-registry-processor", version.ref = "kompot" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-javaTime = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-migrationJdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

koin-ktor = { module = "io.insert-koin:koin-ktor" }

metrik-agent = { module = "io.github.youndie.metrik:agent", version.ref = "metrikAgent" }
tracy-agent = { module = "io.github.youndie.tracy:agent", version.ref = "tracyAgent" }
katcher-client = { module = "io.github.youndie.katcher:client", version.ref = "katcher" }
# Product photos in the storefront (B-30). Coil fetches through a Ktor client the app hands it: the
# browser's fetch engine in the bundle, a mock engine in the tests; Ktor's versions come from its BOM.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-networkKtor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-js = { module = "io.ktor:ktor-client-js" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock" }

shildik-oidcAuthServer = { module = "io.github.youndie.shildik:oidc-auth-server", version.ref = "shildik" }
oidc-appsupport = { module = "io.github.kalinjul.kotlin.multiplatform:oidc-appsupport", version.ref = "oidc" }

[plugins]
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
zavarnik = { id = "io.github.youndie.zavarnik", version.ref = "zavarnik" }
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
